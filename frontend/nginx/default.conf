# Static server for the React application (single-page application).
# Reached only by the gateway through ecommerce-net; it publishes no port.
# The security headers (CSP and others) are added by the gateway, the only
# entry point, so they are declared in one place.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Redirects generated here keep a relative Location (no host or port)
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck of the container
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Files with a content hash in their name (Vite): cached for one year.
    # A missing file is a real 404, never index.html served as JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path is a route of the application (/login, /carrito, /admin...):
    # existing files (favicon.svg) are served, everything else gets index.html and
    # React Router shows the page, or its own "not found" page.
    # index.html is always revalidated, so a new build is picked up at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
