# Docker Compose - ecommerce-microservices-uce
name: ecommerce-uce

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      # Superuser: used only by the init script, never by the services
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # Variables read by infra/postgres/init/01-init-databases.sh
      USER_DB_NAME: ${USER_DB_NAME:?set in .env}
      USER_DB_USER: ${USER_DB_USER:?set in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME:?set in .env}
      PRODUCT_DB_USER: ${PRODUCT_DB_USER:?set in .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set in .env}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:?set in .env}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:?set in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      ORDER_DB_NAME: ${ORDER_DB_NAME:?set in .env}
      ORDER_DB_USER: ${ORDER_DB_USER:?set in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:?set in .env}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:?set in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:?set in .env}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?set in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data-net
    # No "ports": the database is not reachable from the host machine

  # ---------- user-service ----------
  # One-shot job: applies migrations and creates the admin, then exits.
  user-migrate:
    build: ./backend/user-service
    image: ecommerce-uce/user-service
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    restart: "no"
    environment:
      DB_NAME: ${USER_DB_NAME:?set in .env}
      DB_USER: ${USER_DB_USER:?set in .env}
      DB_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net

  user-service:
    build: ./backend/user-service
    image: ecommerce-uce/user-service
    restart: always
    environment:
      DB_NAME: ${USER_DB_NAME:?set in .env}
      DB_USER: ${USER_DB_USER:?set in .env}
      DB_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-uce}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
      - data-net

  # ---------- product-service ----------
  # One-shot job: applies migrations and loads the initial catalog, then exits.
  product-migrate:
    build: ./backend/product-service
    image: ecommerce-uce/product-service
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    restart: "no"
    environment:
      DB_NAME: ${PRODUCT_DB_NAME:?set in .env}
      DB_USER: ${PRODUCT_DB_USER:?set in .env}
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set in .env}
      # Required by the configuration, which the job shares with the service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net

  product-service:
    build: ./backend/product-service
    image: ecommerce-uce/product-service
    restart: always
    environment:
      DB_NAME: ${PRODUCT_DB_NAME:?set in .env}
      DB_USER: ${PRODUCT_DB_USER:?set in .env}
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-uce}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_public_key  # only the public key: it verifies tokens, never issues them
    depends_on:
      postgres:
        condition: service_healthy
      product-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
      - data-net

  # ---------- inventory-service ----------
  # One-shot job: applies migrations and loads the initial stock, then exits.
  inventory-migrate:
    build: ./backend/inventory-service
    image: ecommerce-uce/inventory-service
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    restart: "no"
    environment:
      DB_NAME: ${INVENTORY_DB_NAME:?set in .env}
      DB_USER: ${INVENTORY_DB_USER:?set in .env}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net

  inventory-service:
    build: ./backend/inventory-service
    image: ecommerce-uce/inventory-service
    restart: always
    environment:
      DB_NAME: ${INVENTORY_DB_NAME:?set in .env}
      DB_USER: ${INVENTORY_DB_USER:?set in .env}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-uce}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      # Reached by service name through the Docker network, never by IP
      PRODUCT_SERVICE_URL: http://product-service:8000
      HTTP_CONNECT_TIMEOUT_SECONDS: ${HTTP_CONNECT_TIMEOUT_SECONDS:-2}
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_public_key
    # No depends_on product-service on purpose: reservations work without it,
    # and a stopped product-service must not prevent inventory from starting.
    depends_on:
      postgres:
        condition: service_healthy
      inventory-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
      - data-net

  # ---------- payment-service ----------
  # One-shot job: applies migrations, then exits. There is no initial data.
  payment-migrate:
    build: ./backend/payment-service
    image: ecommerce-uce/payment-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DB_NAME: ${PAYMENT_DB_NAME:?set in .env}
      DB_USER: ${PAYMENT_DB_USER:?set in .env}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
      # Required by the configuration, which the job shares with the service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net

  payment-service:
    build: ./backend/payment-service
    image: ecommerce-uce/payment-service
    restart: always
    environment:
      DB_NAME: ${PAYMENT_DB_NAME:?set in .env}
      DB_USER: ${PAYMENT_DB_USER:?set in .env}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-uce}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      # Disabled unless the .env says "true" explicitly
      PAYMENT_SIMULATION_ENABLED: ${PAYMENT_SIMULATION_ENABLED:-false}
      PAYMENT_SLOW_DELAY_SECONDS: ${PAYMENT_SLOW_DELAY_SECONDS:-8}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
      payment-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
      - data-net

  notification-migrate:
    build: ./backend/notification-service
    image: ecommerce-uce/notification-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      # Database only: the migrations need no JWT key and no internal key
      DB_NAME: ${NOTIFICATION_DB_NAME:?set in .env}
      DB_USER: ${NOTIFICATION_DB_USER:?set in .env}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net

  notification-service:
    build: ./backend/notification-service
    image: ecommerce-uce/notification-service
    restart: always
    environment:
      DB_NAME: ${NOTIFICATION_DB_NAME:?set in .env}
      DB_USER: ${NOTIFICATION_DB_USER:?set in .env}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-uce}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_public_key
    # Does not depend on order-service: it only receives calls
    depends_on:
      postgres:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
      - data-net

  order-migrate:
    build: ./backend/order-service
    image: ecommerce-uce/order-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      # Database only: the migrations need no JWT key and no internal key
      DB_NAME: ${ORDER_DB_NAME:?set in .env}
      DB_USER: ${ORDER_DB_USER:?set in .env}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
    # The image healthcheck calls the API, which a migration job does not run
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-net

  order-service:
    build: ./backend/order-service
    image: ecommerce-uce/order-service
    restart: always
    environment:
      DB_NAME: ${ORDER_DB_NAME:?set in .env}
      DB_USER: ${ORDER_DB_USER:?set in .env}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      # Other services, by their Compose service name
      PRODUCT_SERVICE_URL: http://product-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      HTTP_CONNECT_TIMEOUT_SECONDS: ${HTTP_CONNECT_TIMEOUT_SECONDS:-2}
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:-5}
      ORDER_RESERVATION_TTL_MINUTES: ${ORDER_RESERVATION_TTL_MINUTES:-15}
      RESERVING_SWEEP_MINUTES: ${RESERVING_SWEEP_MINUTES:-2}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      WORKER_MAX_FAST_ATTEMPTS: ${WORKER_MAX_FAST_ATTEMPTS:-10}
      WORKER_BACKOFF_MAX_SECONDS: ${WORKER_BACKOFF_MAX_SECONDS:-300}
      WORKER_SLOW_RETRY_SECONDS: ${WORKER_SLOW_RETRY_SECONDS:-900}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-uce}
    secrets:
      - jwt_public_key
    # Only its own database: if another service is down, orders keep working
    # and the pending operations are retried later
    depends_on:
      postgres:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
      - data-net

  # Same image, no HTTP port. No container_name: it can be scaled with
  #   docker compose up -d --scale order-worker=2
  order-worker:
    image: ecommerce-uce/order-service
    command: ["python", "-m", "app.worker"]
    restart: always
    environment:
      DB_NAME: ${ORDER_DB_NAME:?set in .env}
      DB_USER: ${ORDER_DB_USER:?set in .env}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      # Other services, by their Compose service name
      PRODUCT_SERVICE_URL: http://product-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      HTTP_CONNECT_TIMEOUT_SECONDS: ${HTTP_CONNECT_TIMEOUT_SECONDS:-2}
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:-5}
      ORDER_RESERVATION_TTL_MINUTES: ${ORDER_RESERVATION_TTL_MINUTES:-15}
      RESERVING_SWEEP_MINUTES: ${RESERVING_SWEEP_MINUTES:-2}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      WORKER_MAX_FAST_ATTEMPTS: ${WORKER_MAX_FAST_ATTEMPTS:-10}
      WORKER_BACKOFF_MAX_SECONDS: ${WORKER_BACKOFF_MAX_SECONDS:-300}
      WORKER_SLOW_RETRY_SECONDS: ${WORKER_SLOW_RETRY_SECONDS:-900}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_HEARTBEAT_FILE: /tmp/order-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-60}
    # Progress, not HTTP: the heartbeat file is touched every cycle and before
    # each operation (one call lasts at most ~9 s)
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    # SIGTERM first: the current operation (at most ~9 s) finishes before SIGKILL
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
      - data-net

  # ---------- Frontend (React) ----------
  # Static files built at image build time and served by nginx without root.
  # Reached only through the gateway: no published port, only ecommerce-net,
  # no database, no credentials and no secrets.
  frontend:
    build:
      context: ./frontend
      args:
        # Compile-time value written into the JavaScript bundle. "true" shows the
        # simulated payment options; changing it requires building the image again.
        VITE_PAYMENT_DEMO: ${VITE_PAYMENT_DEMO:-false}
    image: ecommerce-uce/frontend
    restart: always
    read_only: true
    tmpfs:
      # nginx pid and temporary files
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ecommerce-net

  # ---------- API Gateway ----------
  # Single entry point. Only ecommerce-net: it cannot reach PostgreSQL and
  # receives no database credentials, keys or secrets.
  gateway:
    build: ./gateway
    image: ecommerce-uce/gateway
    restart: always
    ports:
      # The only published port of the system, reachable from this PC only
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    # Configuration is part of the image; pid and temporary files use tmpfs
    read_only: true
    tmpfs:
      - /tmp
    # No depends_on: nginx starts even if a service or the frontend is down (that
    # route answers 502) and finds them through Docker DNS when they appear
    networks:
      - ecommerce-net

networks:
  # Gateway and microservices
  ecommerce-net:
  # Internal network: no access to the outside, only services and the database
  data-net:
    internal: true

volumes:
  postgres-data:

secrets:
  # Generated with: python infra/jwt/generate_keys.py
  # Mounted inside the containers at /run/secrets/<name>
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
