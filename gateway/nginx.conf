# API Gateway - main configuration
# The container filesystem is read-only: pid and temporary files go to /tmp (tmpfs).
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # "Server: nginx" without the version, also on error pages
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # --- Request ID ---------------------------------------------------------
    # A client value is accepted only if it is short and safe; otherwise
    # nginx generates its own (32 hex characters).
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9-]{8,64}$" $http_x_request_id;
        default $request_id;
    }

    # --- Access log -----------------------------------------------------------
    # Only the path ($uri), never the query string, headers or body:
    # tokens, passwords and keys are never written to the log.
    log_format gateway escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","client":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_response_time":"$upstream_response_time"}';
    access_log /var/log/nginx/access.log gateway;

    # --- Docker DNS -----------------------------------------------------------
    # Service names are resolved again every 10 s: new replicas are used and
    # removed ones are dropped without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # When a service has no containers, Docker DNS asks the host DNS before
    # answering NXDOMAIN, which took about 2-3 s on the development PC. With
    # 2 s nginx gave up first and kept the old address; with 5 s it receives
    # NXDOMAIN and drops it. Resolution runs in the background, not per request.
    resolver_timeout 5s;

    # --- Rate limit (login only) ----------------------------------------------
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # --- Paths that are never forwarded ---------------------------------------
    # Raw path as sent by the client, without the query string
    map $request_uri $raw_path {
        "~^(?<path>[^?]*)" $path;
        default $request_uri;
    }
    # Encoded dots, slashes, backslashes or "%" (double encoding) and
    # dot segments: no public route needs them.
    map $raw_path $suspicious_path {
        default 0;
        "~*%(25|2e|2f|5c)" 1;
        "~\.\." 1;
        "~\\\\" 1;
    }
    # "internal" anywhere in the path, raw or decoded, in any letter case
    map $raw_path $raw_internal {
        default 0;
        "~*internal" 1;
    }
    map $uri $decoded_internal {
        default 0;
        "~*internal" 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
