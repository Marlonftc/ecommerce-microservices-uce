# API Gateway - single entry point for the clients.
#
# Public routes live under /api; the prefix is removed before forwarding:
#   /api/products/7  ->  product-service  /products/7
# An /api path not listed here is answered by nginx with 404 (deny by default).
# Every other path belongs to the React application (frontend container).

# One upstream per service. "resolve" + "zone": the name is resolved through
# Docker DNS and refreshed while nginx runs (scaling without a restart).
upstream user_backend         { zone user_backend 64k;         server user-service:8000 resolve; }
upstream product_backend      { zone product_backend 64k;      server product-service:8000 resolve; }
upstream inventory_backend    { zone inventory_backend 64k;    server inventory-service:8000 resolve; }
upstream order_backend        { zone order_backend 64k;        server order-service:8000 resolve; }
upstream payment_backend      { zone payment_backend 64k;      server payment-service:8000 resolve; }
upstream notification_backend { zone notification_backend 64k; server notification-service:8000 resolve; }
# Static files of the React application (nginx without root, port 8080)
upstream frontend_backend     { zone frontend_backend 64k;     server frontend:8080 resolve; }

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # --- First barrier for /internal ---------------------------------------
    # The services check X-Internal-Key again (second barrier).
    if ($suspicious_path) { return 404 '{"detail":{"code":"NOT_FOUND","message":"Route not found"}}'; }
    if ($raw_internal)    { return 404 '{"detail":{"code":"NOT_FOUND","message":"Route not found"}}'; }
    if ($decoded_internal) { return 404 '{"detail":{"code":"NOT_FOUND","message":"Route not found"}}'; }

    # --- Response headers ---------------------------------------------------
    # X-Request-ID, nosniff, Content-Security-Policy and the other security
    # headers. A location with its own add_header drops these, so it must
    # include the same file (see @rate_limited).
    include /etc/nginx/snippets/security-headers.conf;

    # --- Headers sent to the services --------------------------------------
    # Declared only here, inherited by every location. Authorization and
    # Idempotency-Key are passed unchanged (nginx forwards client headers).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    # The client's own X-Forwarded-For is replaced, not trusted
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An empty value removes the header: only the services send this key
    proxy_set_header X-Internal-Key "";

    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Another replica is tried only after a quick connection error, and only
    # for idempotent methods (non_idempotent is not enabled): a POST is never
    # sent twice by the gateway.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    # FastAPI redirects (for example /orders/ -> /orders) point to the
    # service path; the client must see the /api path.
    proxy_redirect ~^https?://[^/]+(/.*)$ /api$1;

    # Errors generated by nginx. Errors returned by the services (FastAPI
    # JSON) are passed unchanged: proxy_intercept_errors stays off.
    error_page 413 @too_large;
    error_page 429 @rate_limited;
    error_page 502 503 @unavailable;
    error_page 504 @timeout;

    # --- Gateway health: nginx only, no service is called ----------------
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
    }

    # --- user-service ---------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://user_backend/auth/login;
    }
    location /api/auth/          { proxy_pass http://user_backend/auth/; }
    # Without this, nginx would answer /api/auth with a redirect to /api/auth/
    location = /api/auth {
        return 404 '{"detail":{"code":"NOT_FOUND","message":"Route not found"}}';
    }
    location = /api/users        { proxy_pass http://user_backend/users; }
    location /api/users/         { proxy_pass http://user_backend/users/; }

    # --- product-service --------------------------------------------------
    location = /api/products     { proxy_pass http://product_backend/products; }
    location /api/products/      { proxy_pass http://product_backend/products/; }

    # --- inventory-service ------------------------------------------------
    location = /api/inventory    { proxy_pass http://inventory_backend/inventory; }
    location /api/inventory/     { proxy_pass http://inventory_backend/inventory/; }

    # --- order-service ------------------------------------------------------
    location = /api/cart         { proxy_pass http://order_backend/cart; }
    location /api/cart/          { proxy_pass http://order_backend/cart/; }
    location = /api/orders       { proxy_pass http://order_backend/orders; }
    location /api/orders/        { proxy_pass http://order_backend/orders/; }
    location = /api/admin/operations { proxy_pass http://order_backend/admin/operations; }
    location /api/admin/operations/  { proxy_pass http://order_backend/admin/operations/; }

    # --- payment-service ----------------------------------------------------
    location = /api/payments     { proxy_pass http://payment_backend/payments; }
    location /api/payments/      { proxy_pass http://payment_backend/payments/; }

    # --- notification-service ---------------------------------------------
    location = /api/notifications { proxy_pass http://notification_backend/notifications; }
    location /api/notifications/  { proxy_pass http://notification_backend/notifications/; }

    # --- Any other /api path: not forwarded -----------------------------------
    location = /api {
        return 404 '{"detail":{"code":"NOT_FOUND","message":"Route not found"}}';
    }
    location /api/ {
        return 404 '{"detail":{"code":"NOT_FOUND","message":"Route not found"}}';
    }

    # --- React application ---------------------------------------------------
    # Everything else: index.html, /assets/* and the routes of the application
    # (/login, /carrito, /admin...), which the frontend answers with index.html.
    # The /internal and suspicious-path barriers above run before this location.
    location / {
        # Static files only: no method that sends data reaches the frontend
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"detail":{"code":"METHOD_NOT_ALLOWED","message":"Method not allowed"}}';
        }
        # The frontend keeps relative redirects; the /api rewrite above must not apply
        proxy_redirect off;
        proxy_pass http://frontend_backend;
    }

    # --- JSON bodies for the errors generated by nginx --------------------
    location @too_large {
        return 413 '{"detail":{"code":"PAYLOAD_TOO_LARGE","message":"Request body exceeds 1 MB"}}';
    }
    location @rate_limited {
        # Own add_header: the common headers are included again
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 6 always;
        return 429 '{"detail":{"code":"TOO_MANY_REQUESTS","message":"Too many login attempts, try again later"}}';
    }
    location @unavailable {
        return 502 '{"detail":{"code":"UPSTREAM_UNAVAILABLE","message":"The service is not available"}}';
    }
    location @timeout {
        return 504 '{"detail":{"code":"UPSTREAM_TIMEOUT","message":"The service did not respond in time"}}';
    }
}
