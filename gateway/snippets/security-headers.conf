# Response headers of the gateway, for the API and for the React application.
#
# nginx rule: a block that declares its own add_header stops inheriting the
# ones of the enclosing block. This file is therefore included at server level
# AND in every location that adds a header of its own (@rate_limited).
# "always": also sent with 4xx/5xx responses.

# Traceability: the same id is in the response, the request to the service and the log
add_header X-Request-ID $req_id always;
add_header X-Content-Type-Options nosniff always;

# Only files of this origin. The Vite build has no inline scripts or styles and no
# data: URIs, so neither 'unsafe-inline' nor 'unsafe-eval' is needed. The API is
# the same origin (/api), so connect-src 'self' covers it.
# No upgrade-insecure-requests and no HSTS: the system is served over plain HTTP
# on 127.0.0.1; both belong to a deployment with TLS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
