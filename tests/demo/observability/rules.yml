# Generated by generate_dashboard.py; edit its rules() and regenerate.
groups:
  - name: uce_stage_a
    interval: 5s
    rules:
      - record: uce:component_expected
        expr: |
          vector(1)
        labels:
          component: gateway
      - record: uce:component_expected
        expr: |
          vector(1)
        labels:
          component: frontend
      - record: uce:component_expected
        expr: |
          vector(1)
        labels:
          component: user-service
      - record: uce:component_expected
        expr: |
          vector(1)
        labels:
          component: product-service
      - record: uce:component_expected
        expr: |
          vector(1)
        labels:
          component: inventory-service
      - record: uce:component_expected
        expr: |
          vector(1)
        labels:
          component: order-service
      - record: uce:component_expected
        expr: |
          vector(1)
        labels:
          component: payment-service
      - record: uce:component_expected
        expr: |
          vector(1)
        labels:
          component: notification-service
      - record: uce:probe_success:fresh
        expr: |
          probe_success{job="blackbox"}
          and on(job, instance) (up{job="blackbox"} == 1)
          and on(job, instance) ((time() - timestamp(probe_success{job="blackbox"})) <= 25)
          and on(job, instance) ((time() - timestamp(up{job="blackbox"})) <= 25)
      - record: uce:live
        expr: |
          max by(component) (uce:probe_success:fresh{probe="live"})
      - record: uce:ready
        expr: |
          max by(component) (uce:probe_success:fresh{probe="ready"})
      - record: uce:edge
        expr: |
          max by(component) (uce:probe_success:fresh{probe="edge"})
      - record: uce:component_state
        expr: |
          (3 * ((uce:live == 1) and on(component) (uce:ready == 1)))
          or on(component) (2 * ((uce:live == 1) and on(component) (uce:ready == 0)))
          or on(component) ((uce:live == 0) + 1)
          or on(component) (3 * (uce:edge == 1))
          or on(component) ((uce:edge == 0) + 1)
          or on(component) (0 * uce:component_expected)
      - record: uce:frontend_route_state
        expr: |
          (3 * (max(uce:probe_success:fresh{probe="route"}) == 1))
          or ((2 + (max(uce:probe_success:fresh{probe="route"}) == 0))
          and (max(uce:probe_success:fresh{component="gateway", probe="edge"}) == 1))
          or vector(0)
      - record: uce:down_transition
        expr: |
          ((uce:component_state == bool 1)
          * on(component) (uce:component_state offset 5s > bool 1)
          and on(component) ((time() - timestamp(uce:component_state offset 5s)) <= 15))
          or on(component) (0 * uce:component_expected)
      - record: uce:recovery_transition
        expr: |
          ((uce:component_state == bool 3)
          * on(component) (uce:component_state offset 5s > bool 0)
          * on(component) (uce:component_state offset 5s < bool 3)
          and on(component) ((time() - timestamp(uce:component_state offset 5s)) <= 15))
          or on(component) (0 * uce:component_expected)
