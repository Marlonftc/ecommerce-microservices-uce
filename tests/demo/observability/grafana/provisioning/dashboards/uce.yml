apiVersion: 1
providers:
  - name: UCE observability
    orgId: 1
    folder: UCE
    folderUid: uce
    type: file
    disableDeletion: true
    # Polling (>10 s) also detects updates on Docker Desktop Windows bind mounts.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
