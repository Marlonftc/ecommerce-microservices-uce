        {
          "series": "probe_success{job=\"blackbox\",component=\"user-service\",probe=\"live\",instance=\"http://user-service:8000/health/live\"}",
          "values": "1+0x12"
        },
        {
          "series": "up{job=\"blackbox\",component=\"user-service\",probe=\"live\",instance=\"http://user-service:8000/health/live\"}",
          "values": "1+0x12"
        },
